<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gig Radar | Surbiton</title>
  <meta name="theme-color" content="#7a2e12" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="shell header-grid">
      <div>
        <p class="eyebrow">Surbiton + reachable roots music</p>
        <h1>Gig Radar</h1>
        <p class="lede">Jazz, swing, trad Irish, folk, old-time, cajun, zydeco, honky tonk and roots-adjacent shows, with a lower bar nearby and a higher bar for longer trips.</p>
      </div>
      <nav class="top-nav" aria-label="Other views">
        <a class="btn primary" href="index.html">Family Calendar</a>
        <a class="btn" href="gigs.ics">Subscribe</a>
      </nav>
    </div>
  </header>

  <main class="shell app-main">
    <section class="control-panel" aria-label="Gig controls">
      <div class="lens-tabs" id="lensTabs" role="tablist" aria-label="Gig sections"></div>
      <div class="filter-row">
        <label class="field">
          <span>Search</span>
          <input id="searchBox" type="search" placeholder="Artist, venue, genre, trad, swing, cajun..." autocomplete="off" />
        </label>
        <label class="field small-field">
          <span>Range</span>
          <select id="dateRange">
            <option value="next30">Next 30 days</option>
            <option value="next7">Next 7 days</option>
            <option value="next90">Next 3 months</option>
            <option value="all">All upcoming</option>
          </select>
        </label>
      </div>
    </section>

    <section class="status-strip" id="statusStrip" aria-live="polite"></section>
    <section id="content" aria-live="polite"></section>
  </main>

  <dialog id="feedbackDialog" aria-labelledby="feedbackTitle">
    <button class="modal-close" id="feedbackClose" aria-label="Close feedback" type="button">x</button>
    <form id="feedbackForm" method="dialog">
      <div class="modal-head">
        <h2 id="feedbackTitle">Not for us</h2>
        <p id="feedbackSubtitle" class="muted"></p>
      </div>
      <label class="field full">
        <span>Why skip this kind of thing?</span>
        <textarea id="feedbackNote" rows="5" placeholder="Wrong genre, too far, too late, not worth childcare..."></textarea>
      </label>
      <div class="modal-actions">
        <button class="btn primary" type="submit">Save feedback</button>
        <button class="btn" id="cancelFeedbackBtn" type="button">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="gig-data.js"></script>
  <script>
  (() => {
    const DATA = window.GIG_DATA || {};
    const GIGS = DATA.gigs || [];
    const WATCHLIST = DATA.watchlist || [];
    const FEEDBACK_KEY = 'gig-radar-feedback-v1';
    const ARCHIVE_KEY = 'gig-radar-archive-v1';
    const SAVED_KEY = 'gig-radar-saved-v1';
    const STATE_KEY = 'gig-radar-state-v2';

    const state = { lens: 'home', q: '', range: 'next30' };
    const personal = { saved: new Set(), archived: new Set(), feedback: [] };
    let pendingFeedbackId = null;
    let expandedList = false;
    const today = DATA.meta?.dateBasis || new Date().toISOString().slice(0, 10);

    const lenses = [
      { id: 'home', label: 'Best next', help: 'Soon and high-signal.' },
      { id: 'all', label: 'All', help: 'Everything upcoming in range.' },
      { id: 'nearby', label: 'Nearby', help: 'Lower bar, easier trip.' },
      { id: 'genre', label: 'In genre', help: 'Trad, swing, folk, roots.' },
      { id: 'date', label: 'Date night', help: 'Worth childcare.' },
      { id: 'trip', label: 'Worth trip', help: 'Further, but special.' },
      { id: 'saved', label: 'Saved', help: 'Things you starred.' },
      { id: 'archive', label: 'Archive', help: 'Hidden this time only.' }
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[c]));
    const lower = (value) => String(value || '').toLowerCase();
    const pad = (n) => String(n).padStart(2, '0');

    function parseIso(iso) {
      const [y, m, d] = String(iso || '').split('-').map(Number);
      return y && m && d ? new Date(y, m - 1, d) : null;
    }

    function addDays(iso, days) {
      const date = parseIso(iso);
      date.setDate(date.getDate() + days);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function compactDate(iso) {
      return String(iso || '').replace(/-/g, '');
    }

    function parseClock(value) {
      const match = String(value || '').match(/\b(\d{1,2})[:.](\d{2})\b/);
      return match ? `${pad(Math.min(Number(match[1]), 23))}:${pad(Math.min(Number(match[2]), 59))}` : null;
    }

    function fmtDate(iso) {
      const date = parseIso(iso);
      return date ? new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(date) : iso || '';
    }

    function title(gig) {
      return gig.artist && gig.title && gig.title !== gig.artist ? `${gig.artist} - ${gig.title}` : gig.artist || gig.title || 'Gig';
    }

    function hay(gig) {
      return lower([gig.title, gig.artist, gig.venue, gig.area, gig.note, gig.cost, gig.travel, (gig.genres || []).join(' ')].join(' '));
    }

    function isArchived(id) { return personal.archived.has(id); }
    function isSaved(id) { return personal.saved.has(id); }
    function feedbackFor(id, action = 'exclude') { return personal.feedback.find(item => item.id === id && item.action === action) || null; }
    function isSkipped(id) { return Boolean(feedbackFor(id)); }

    function isNearby(gig) {
      return gig.travel === 'Local (SW London)' || /surbiton|kingston|wimbledon|richmond|twickenham|barnes|putney|waterloo|south bank/.test(hay(gig));
    }

    function isInGenre(gig) {
      return /(hot jazz|trad jazz|new orleans|gypsy jazz|django|manouche|swing|trad irish|irish|folk|old-time|old time|cajun|zydeco|honky tonk|skiffle|western swing|old-school country|jug band)/.test(hay(gig));
    }

    function isDateNight(gig) {
      const start = parseClock(gig.time);
      return Boolean(start && start >= '18:00' && (isInGenre(gig) || isNearby(gig)));
    }

    function isWorthTrip(gig) {
      return !isNearby(gig) && (isInGenre(gig) || /festival|special|rare|all-dayer|weekender|dance/.test(hay(gig)));
    }

    function daysUntil(iso) {
      const a = parseIso(today);
      const b = parseIso(iso);
      return a && b ? Math.round((b - a) / 86400000) : 999;
    }

    function score(gig) {
      let value = 0;
      const soon = daysUntil(gig.date);
      if (soon >= 0 && soon <= 14) value += 3;
      if (isNearby(gig)) value += 2;
      if (isInGenre(gig)) value += 3;
      if (/free/i.test(gig.cost || '')) value += 1;
      if (/verify/i.test(gig.confidence || '')) value -= 2;
      return value;
    }

    function rangeOk(gig) {
      const end = gig.endDate || gig.date;
      if (end < today) return false;
      if (state.range === 'next7') return gig.date <= addDays(today, 7);
      if (state.range === 'next90') return gig.date <= addDays(today, 90);
      if (state.range === 'all') return true;
      return gig.date <= addDays(today, 30);
    }

    function lensOk(gig) {
      if (state.lens === 'sources') return false;
      if (state.lens === 'archive') return isArchived(gig.id) && !isSkipped(gig.id);
      if (state.lens === 'skips') return isSkipped(gig.id);
      if (state.lens !== 'archive' && state.lens !== 'skips' && (isArchived(gig.id) || isSkipped(gig.id))) return false;
      if (state.lens === 'all') return true;
      if (state.lens === 'saved') return isSaved(gig.id);
      if (state.lens === 'nearby') return isNearby(gig);
      if (state.lens === 'genre') return isInGenre(gig);
      if (state.lens === 'date') return isDateNight(gig);
      if (state.lens === 'trip') return isWorthTrip(gig);
      if (state.lens === 'home') return score(gig) >= 4;
      return true;
    }

    function rows() {
      const q = lower(state.q);
      return GIGS
        .filter(rangeOk)
        .filter(lensOk)
        .filter(gig => !q || hay(gig).includes(q))
        .sort((a, b) => (a.sortKey || a.date).localeCompare(b.sortKey || b.date) || score(b) - score(a));
    }

    function groupName(gig) {
      const diff = daysUntil(gig.date);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      if (diff <= 7) return 'Next 7 days';
      const date = parseIso(gig.date);
      return date ? new Intl.DateTimeFormat('en-GB', { month: 'long' }).format(date) : 'Later';
    }

    function groups(items) {
      const map = new Map();
      for (const gig of items) {
        const key = groupName(gig);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(gig);
      }
      return map;
    }

    function googleDateRange(gig) {
      const start = parseClock(gig.time);
      if (!start) return `${compactDate(gig.date)}/${compactDate(addDays(gig.endDate || gig.date, 1))}`;
      const [h, m] = start.split(':').map(Number);
      const d = parseIso(gig.date);
      d.setHours(h, m + 120, 0, 0);
      const endDate = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const endClock = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      return `${compactDate(gig.date)}T${start.replace(':', '')}00/${compactDate(endDate)}T${endClock.replace(':', '')}00`;
    }

    function googleUrl(gig) {
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title(gig),
        dates: googleDateRange(gig),
        ctz: 'Europe/London',
        details: [(gig.genres || []).join(' / '), gig.note, gig.url ? `Source: ${gig.url}` : ''].filter(Boolean).join('\n\n'),
        location: [gig.venue, gig.area].filter(Boolean).join(', ')
      });
      return `https://calendar.google.com/calendar/render?${params}`;
    }

    function card(gig) {
      const liked = feedbackFor(gig.id, 'include');
      const skipped = feedbackFor(gig.id, 'exclude');
      return `
        <article class="event-card ${isArchived(gig.id) ? 'is-archived' : ''} ${skipped ? 'is-muted' : ''}">
          <div class="date-block">
            <strong>${esc(fmtDate(gig.date))}</strong>
            <span>${esc(gig.time || 'Time not listed')}</span>
          </div>
          <div class="event-main">
            <a class="title-button" href="${esc(gig.url || '#')}" target="_blank" rel="noopener">${esc(title(gig))}</a>
            <div class="event-meta">${esc([gig.venue, gig.area].filter(Boolean).join(', '))}</div>
            ${gig.note ? `<p>${esc(gig.note)}</p>` : ''}
            ${skipped?.note ? `<p class="feedback-note"><strong>Skip reason:</strong> ${esc(skipped.note)}</p>` : ''}
            <div class="tag-row">
              ${(gig.genres || []).slice(0, 4).map(x => `<span>${esc(x)}</span>`).join('')}
              ${gig.travel ? `<span>${esc(gig.travel)}</span>` : ''}
              ${gig.cost ? `<span>${esc(gig.cost)}</span>` : ''}
              ${gig.confidence === 'verify' ? '<span>verify</span>' : ''}
            </div>
            <div class="action-row">
              <a class="btn small primary" href="${esc(googleUrl(gig))}" target="_blank" rel="noopener">Google</a>
              <button class="btn small ${isSaved(gig.id) ? 'active' : ''}" type="button" data-save="${esc(gig.id)}">${isSaved(gig.id) ? 'Saved' : 'Save'}</button>
              <button class="btn small" type="button" data-archive="${esc(gig.id)}">${isArchived(gig.id) ? 'Unarchive' : 'Archive'}</button>
              <details class="tune-menu">
                <summary>Tune</summary>
                <button class="btn small good ${liked ? 'active' : ''}" type="button" data-like="${esc(gig.id)}">${liked ? 'More like this saved' : 'More like this'}</button>
                <button class="btn small danger ${skipped ? 'active' : ''}" type="button" data-skip="${esc(gig.id)}">${skipped ? 'Edit not for us' : 'Not for us'}</button>
              </details>
            </div>
          </div>
        </article>
      `;
    }

    function renderTabs() {
      $('lensTabs').innerHTML = lenses.map(lens => `
        <button class="lens ${state.lens === lens.id ? 'active' : ''}" type="button" data-lens="${esc(lens.id)}">
          <strong>${esc(lens.label)}</strong>
          <span>${esc(lens.help)}</span>
        </button>
      `).join('');
    }

    function renderStatus(items) {
      const archived = [...personal.archived].filter(id => !isSkipped(id)).length;
      const likes = personal.feedback.filter(item => item.action === 'include').length;
      const skips = personal.feedback.filter(item => item.action === 'exclude').length;
      $('statusStrip').innerHTML = `
        <div>Updated ${esc(today)} / ${items.length} matches / ${GIGS.length} upcoming</div>
        <div class="status-actions">
          <span>${[personal.saved.size ? `${personal.saved.size} saved` : '', archived ? `${archived} archived` : '', likes ? `${likes} liked` : '', skips ? `${skips} skipped` : ''].filter(Boolean).map(esc).join(' / ') || 'Archive hides this gig. Not for us trains future updates.'}</span>
          <button class="btn small" type="button" data-lens="${state.lens === 'sources' ? 'home' : 'sources'}">${state.lens === 'sources' ? 'Back to gigs' : 'Sources + feedback'}</button>
        </div>
      `;
    }

    function renderSources() {
      $('content').innerHTML = `
        <section class="section-head">
          <div>
            <h2>Sources and watchlist</h2>
            <p>Archive is local-only. More like this and Not for us are exported for future updates.</p>
          </div>
          <button class="btn primary" type="button" data-export-feedback>Export feedback</button>
        </section>
        <section class="plain-section">
          <h3>Feedback saved in this browser</h3>
          ${personal.feedback.length ? personal.feedback.map(item => `
            <div class="source-row">
              <strong>${esc(item.action === 'include' ? 'More like this' : 'Not for us')}: ${esc(item.artist || item.title || item.id)}</strong>
              <span>${esc([item.date, item.venue, item.note].filter(Boolean).join(' - '))}</span>
              <button class="btn small" type="button" data-remove-feedback="${esc(item.id)}">Remove</button>
            </div>
          `).join('') : '<p class="muted">No feedback saved.</p>'}
        </section>
        <section class="plain-section">
          <h3>Watchlist</h3>
          ${WATCHLIST.map(item => `<div class="source-row"><strong>${esc(item.name || item.venue || 'Watch item')}</strong><span>${esc([item.venue, item.note, item.url].filter(Boolean).join(' - '))}</span></div>`).join('') || '<p class="muted">No watchlist rows.</p>'}
        </section>
      `;
    }

    function render() {
      renderTabs();
      $('searchBox').value = state.q;
      $('dateRange').value = state.range;
      if (state.lens === 'sources') {
        renderStatus([]);
        renderSources();
        persist();
        return;
      }
      const items = rows();
      renderStatus(items);
      if (!items.length) {
        $('content').innerHTML = '<section class="empty-state"><h2>No matching gigs</h2><p>Try another lens or a wider range.</p></section>';
      } else {
        const limit = state.lens === 'home' && !expandedList ? 24 : items.length;
        const visible = items.slice(0, limit);
        $('content').innerHTML = `
          <section class="section-head"><div><h2>${esc(lenses.find(x => x.id === state.lens)?.label || 'Gigs')}</h2><p>${esc(lenses.find(x => x.id === state.lens)?.help || '')}</p></div>${state.lens === 'archive' && items.length ? '<button class="btn" type="button" data-unarchive-all>Unarchive all</button>' : ''}${state.lens === 'skips' ? '<button class="btn" type="button" data-export-feedback>Export feedback</button>' : ''}</section>
          ${[...groups(visible).entries()].map(([name, gigs]) => `<section class="event-group"><h3>${esc(name)}</h3><div class="event-list">${gigs.map(card).join('')}</div></section>`).join('')}
          ${items.length > visible.length ? `<button class="btn load-more" type="button" data-show-all>Show all ${items.length}</button>` : ''}
        `;
      }
      persist();
    }

    function feedbackObject(gig, action, note = '') {
      return { action, id: gig.id, title: gig.title || '', artist: gig.artist || '', venue: gig.venue || '', area: gig.area || '', genres: gig.genres || [], date: gig.date || '', source: gig.source || '', url: gig.url || '', note, createdAt: new Date().toISOString() };
    }

    function persist() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
        localStorage.setItem(SAVED_KEY, JSON.stringify([...personal.saved]));
        localStorage.setItem(ARCHIVE_KEY, JSON.stringify([...personal.archived]));
        localStorage.setItem(FEEDBACK_KEY, JSON.stringify(personal.feedback));
      } catch {}
    }

    function load() {
      try { Object.assign(state, JSON.parse(localStorage.getItem(STATE_KEY) || '{}')); } catch {}
      try { personal.saved = new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || '[]').map(String)); } catch {}
      try { personal.archived = new Set(JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]').map(String)); } catch {}
      try {
        const feedback = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');
        personal.feedback = Array.isArray(feedback) ? feedback.filter(item => item && item.id) : [];
      } catch {}
    }

    function toggleSave(id) {
      if (personal.saved.has(id)) personal.saved.delete(id);
      else personal.saved.add(id);
      render();
      toast(personal.saved.has(id) ? 'Saved' : 'Removed from saved');
    }

    function toggleArchive(id) {
      if (personal.archived.has(id)) personal.archived.delete(id);
      else personal.archived.add(id);
      render();
      toast(personal.archived.has(id) ? 'Archived' : 'Unarchived');
    }

    function saveLike(id) {
      const gig = GIGS.find(item => item.id === id);
      if (!gig) return;
      personal.feedback = personal.feedback.filter(item => !(item.id === id && item.action === 'include'));
      personal.feedback.unshift(feedbackObject(gig, 'include', 'More like this'));
      render();
      toast('Saved: more like this');
    }

    function openFeedback(id) {
      const gig = GIGS.find(item => item.id === id);
      if (!gig) return;
      pendingFeedbackId = id;
      $('feedbackSubtitle').textContent = [title(gig), gig.venue].filter(Boolean).join(' - ');
      $('feedbackNote').value = feedbackFor(id)?.note || '';
      $('feedbackDialog').showModal();
      $('feedbackNote').focus();
    }

    function saveSkip() {
      const gig = GIGS.find(item => item.id === pendingFeedbackId);
      if (!gig) return;
      personal.feedback = personal.feedback.filter(item => item.id !== gig.id);
      personal.feedback.unshift(feedbackObject(gig, 'exclude', $('feedbackNote').value.trim()));
      pendingFeedbackId = null;
      render();
      toast('Saved as not for us');
    }

    function removeFeedback(id) {
      personal.feedback = personal.feedback.filter(item => item.id !== id);
      render();
      toast('Feedback removed');
    }

    function unarchiveAll() {
      personal.archived.clear();
      render();
      toast('Archive cleared');
    }

    function exportFeedback() {
      const blob = new Blob([`${JSON.stringify({ updated: new Date().toISOString(), calendarFeedback: [], gigFeedback: personal.feedback }, null, 2)}\n`], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'user-feedback.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast('Feedback exported');
    }

    function toast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      window.setTimeout(() => $('toast').classList.remove('show'), 1700);
    }

    function wire() {
      $('searchBox').addEventListener('input', event => { state.q = event.target.value; expandedList = false; render(); });
      $('dateRange').addEventListener('change', event => { state.range = event.target.value; expandedList = false; render(); });
      $('feedbackClose').addEventListener('click', () => $('feedbackDialog').close());
      $('cancelFeedbackBtn').addEventListener('click', () => $('feedbackDialog').close());
      $('feedbackForm').addEventListener('submit', event => { event.preventDefault(); saveSkip(); $('feedbackDialog').close(); });
      document.addEventListener('click', event => {
        const lens = event.target.closest('[data-lens]');
        if (lens) { state.lens = lens.dataset.lens; expandedList = false; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        const save = event.target.closest('[data-save]');
        if (save) return toggleSave(save.dataset.save);
        const archive = event.target.closest('[data-archive]');
        if (archive) return toggleArchive(archive.dataset.archive);
        const like = event.target.closest('[data-like]');
        if (like) return saveLike(like.dataset.like);
        const skip = event.target.closest('[data-skip]');
        if (skip) return openFeedback(skip.dataset.skip);
        const remove = event.target.closest('[data-remove-feedback]');
        if (remove) return removeFeedback(remove.dataset.removeFeedback);
        const exportButton = event.target.closest('[data-export-feedback]');
        if (exportButton) return exportFeedback();
        const unarchive = event.target.closest('[data-unarchive-all]');
        if (unarchive) return unarchiveAll();
        const all = event.target.closest('[data-show-all]');
        if (all) { expandedList = true; render(); }
      });
    }

    load();
    wire();
    render();
  })();
  </script>
</body>
</html>
