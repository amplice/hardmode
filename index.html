<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Calendar | Surbiton</title>
  <meta name="theme-color" content="#096c63" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="shell header-grid">
      <div>
        <p class="eyebrow">Surbiton + easy trips</p>
        <h1>Family Calendar</h1>
        <p class="lede">Things worth knowing about with a toddler: weekday childcare options, weekend family plans, daytime music, theatre, Hampton Court, railway days and properly worthwhile trips.</p>
      </div>
      <nav class="top-nav" aria-label="Other views">
        <a class="btn primary" href="gigs.html">Gig Radar</a>
        <a class="btn" href="events.ics">Subscribe</a>
      </nav>
    </div>
  </header>

  <main class="shell app-main">
    <section class="control-panel" aria-label="Calendar controls">
      <div class="lens-tabs" id="lensTabs" role="tablist" aria-label="Calendar sections"></div>
      <div class="filter-row">
        <label class="field">
          <span>Search</span>
          <input id="searchBox" type="search" placeholder="Rose, railway, Hampton Court, toddler, folk..." autocomplete="off" />
        </label>
        <label class="field small-field">
          <span>Range</span>
          <select id="dateRange">
            <option value="next30">Next 30 days</option>
            <option value="next7">Next 7 days</option>
            <option value="weekend">This weekend</option>
            <option value="next90">Next 3 months</option>
            <option value="all">Through end of year</option>
          </select>
        </label>
      </div>
    </section>

    <section class="status-strip" id="statusStrip" aria-live="polite"></section>
    <section id="content" aria-live="polite"></section>
  </main>

  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <button class="modal-close" id="modalClose" aria-label="Close" type="button">x</button>
    <div id="detailContent"></div>
  </dialog>

  <dialog id="feedbackDialog" aria-labelledby="feedbackTitle">
    <button class="modal-close" id="feedbackClose" aria-label="Close feedback" type="button">x</button>
    <form id="feedbackForm" method="dialog">
      <div class="modal-head">
        <h2 id="feedbackTitle">Not for us</h2>
        <p id="feedbackSubtitle" class="muted"></p>
      </div>
      <label class="field full">
        <span>Why skip this kind of thing?</span>
        <textarea id="feedbackNote" rows="5" placeholder="Too far, wrong genre, too old for her, not worth childcare..."></textarea>
      </label>
      <div class="modal-actions">
        <button class="btn primary" type="submit">Save feedback</button>
        <button class="btn" id="cancelFeedbackBtn" type="button">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="calendar-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
